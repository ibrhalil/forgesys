# ============================================================
# Prod stack: PostgreSQL + Redis + app (self-contained).
# Requires a .env file (see .env.example) — all values are read
# from environment variables without defaults.
#
#   docker compose -f docker-compose-prod.yml up -d --build
#
# Use --build whenever application/module code changes so the
# image is rebuilt; without it a stale image may be reused.
#
# Security posture:
#   - DB port is NOT published; only reachable on the internal
#     network by the app. Use `docker compose exec db psql` for
#     admin access.
#   - All services: no-new-privileges, least capability.
#   - App binds infra/config (ro), infra/templates (ro),
#     infra/ssl (ro), infra/logs (rw).
# ============================================================
services:
  # One-shot: ensure the bind-mount dirs exist with the right ownership before
  # db/redis start. Makes a wiped infra/data fully recoverable and removes the
  # manual `sudo chown` first-install step on Linux hosts.
  data-init:
    image: alpine:3.20
    container_name: forgesys-data-init-prod
    restart: "no"
    volumes:
      - ./infra/data/postgres:/pgdata
      - ./infra/data/redis:/redisdata
    command: sh -c "chown -R 70:70 /pgdata && chown -R 999:999 /redisdata"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  db:
    image: postgres:16-alpine
    container_name: forgesys-db-prod
    init: true
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # Subdirectory of bind-mount as PGDATA — robust against mount-point
      # hidden files (.gitkeep, .DS_Store, Docker metadata).
      PGDATA: /var/lib/postgresql/data/pgdata
    # No `ports:` — DB is internal-only. Admin via:
    #   docker compose -f docker-compose-prod.yml exec db psql -U $POSTGRES_USER -d $POSTGRES_DB
    expose:
      - "5432"
    volumes:
      - ./infra/data/postgres:/var/lib/postgresql/data
      - ./infra/init-sql:/docker-entrypoint-initdb.d:ro
    # Real query, not just pg_isready: pg_isready never reaches authentication,
    # so a broken data dir (e.g. infra/data deleted while the container ran)
    # still reports healthy. SELECT 1 catches that as UNHEALTHY.
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -h /var/run/postgresql -tAc 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      # FOWNER: entrypoint chmod's /var/run/postgresql (socket dir).
      - FOWNER
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - forgesys-net
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.4-alpine
    container_name: forgesys-redis-prod
    init: true
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    expose:
      - "6379"
    volumes:
      - ./infra/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      # DAC_OVERRIDE: the entrypoint (root, caps dropped) runs `find /data` to
      # chown everything to redis; without it root cannot traverse the 700
      # appendonlydir owned by UID 999 on restart-with-existing-data → crash loop.
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - forgesys-net
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgesys-app
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      # Externalized config overlay (optional) — infra/config/*.yaml override jar-baked values.
      - SPRING_CONFIG_ADDITIONAL_LOCATION=${SPRING_CONFIG_ADDITIONAL_LOCATION:-optional:file:/config/}
      # File-based log destination inside the container (mounted below).
      - LOGGING_FILE_PATH=${LOGGING_FILE_PATH:-/app/logs}
    volumes:
      # Externalized prod overrides (read-only)
      - ./infra/config:/config:ro
      # Email/templates (read-only)
      - ./infra/templates:/templates:ro
      # TLS material (read-only)
      - ./infra/ssl:/ssl:ro
      # Spring Boot file appender destination (read-write)
      - ./infra/logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - forgesys-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "10"

networks:
  forgesys-net:
    driver: bridge
