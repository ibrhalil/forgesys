name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Aynı branch için eski run'ları iptal et (yeni push gelince)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven + H2 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Test profili H2 (MODE=PostgreSQL) kullanır -> PostgreSQL/Redis gerekmez.
      # Sadece backend + upstream (common, persistence) build edilir. frontend
      # modülü atlanır çünkü paralel "frontend" job'ında lint+build koşar; böylece
      # npm install/build iki kez çalışmaz. backend testleri static resource'lara
      # bağımlı değil (AuditingTest, ForgeSysApplicationTests).
      - name: Build & Test
        run: ./mvnw --no-transfer-progress clean install -pl backend -am

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # package-lock.json commit edilmez (.npmrc package-lock=false)
          # -> cache: npm kullanmıyoruz.

      # Lock file yok (proje politikası: .npmrc package-lock=false).
      # --include=optional: native paketler (esbuild/rollup) linux için kurulur.
      - name: Install dependencies
        run: npm install --include=optional

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc -b && vite build)
        run: npm run build
