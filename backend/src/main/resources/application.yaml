spring:
  application:
    name: forgesys
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

forgesys:
  multi-tenancy:
    base-domain: ${BASE_DOMAIN:localhost}
  security:
    # Global password pepper (K-23). HMAC-SHA256 pre-hash key combined with BCrypt
    # so a DB leak alone cannot brute-force password hashes. MUST be non-blank —
    # a blank value fails startup (SecurityConfig). NOT for the test/dev defaults.
    # Prod: set via PASSWORD_PEPPER env var (32+ random chars). Never log/commit.
    password-pepper: ${PASSWORD_PEPPER:}
