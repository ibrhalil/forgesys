spring:
  application:
    name: forgesys
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    web:
      pageable:
        default-page-size: 20
        # Upper bound for ?size= on GET lists — aligned with the UI rows-per-page
        # selector (5..1000). Values above this are silently clamped by Spring Data.
        max-page-size: 1000

management:
  endpoints:
    web:
      exposure:
        # K-43: metrics + prometheus scrape endpoint. Prod narrows this
        # (application-prod.yaml) and moves management to its own port.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

forgesys:
  multi-tenancy:
    base-domain: ${BASE_DOMAIN:localhost}
  modules:
    # K-16 modules activated for every tenant at provisioning (and backfilled at
    # startup for pre-module-system tenants). Keys must exist in ModuleDefinition.
    # 'apps' (K-15 custom app builder) is FREE + default so adoption is the point;
    # plans separate by plan limits (PlanDefinition.maxApps/maxRecordsPerApp).
    # NOTE: the built-in fallback in ModuleProperties.DEFAULT_KEYS stays 'pm'-only —
    # the test profile has no ModuleProperties bean and must not run module
    # migrations implicitly; ITs activate modules explicitly.
    default-keys: ${FORGESYS_MODULES_DEFAULT_KEYS:pm,apps,notes}
  provisioning:
    # K-47 sample data seeding (Linear-style onboarding content) for NEWLY provisioned
    # tenants — provisioning-only, existing tenants are unaffected. Fail-safe: a
    # seeding failure never breaks provisioning.
    sample-data:
      enabled: ${FORGESYS_SAMPLE_DATA:true}
  mail:
    # Outgoing mail (user lifecycle + mail epic). Prod sends via SMTP (SmtpMailSender,
    # spring.mail.* in application-prod.yaml); dev logs (LogMailSender); test collects
    # in memory (InMemoryMailSender). From must be RFC 822 ("Name <addr>").
    from: ${MAIL_FROM:ForgeSys <no-reply@forgessy.local>}
    # Template language for all recipients until per-user preferences exist (tr|en).
    default-language: ${MAIL_DEFAULT_LANGUAGE:tr}
    # Optional filesystem override for the mail templates. Single git source is
    # infra/templates/mail (build-injected into the jar's classpath — K-51); this
    # override wins per file, missing files fall back to the classpath copy.
    templates-dir: ${MAIL_TEMPLATES_DIR:}
  security:
    # Global password pepper (K-23). HMAC-SHA256 pre-hash key combined with BCrypt
    # so a DB leak alone cannot brute-force password hashes. MUST be non-blank —
    # a blank value fails startup (SecurityConfig). NOT for the test/dev defaults.
    # Prod: set via PASSWORD_PEPPER env var (32+ random chars). Never log/commit.
    password-pepper: ${PASSWORD_PEPPER:}
    # K-21 tenant signup. App base URL used to build the verification link emailed
    # to the admin; in dev this points at the Vite frontend (which POSTs the token
    # back to /api/v1/auth/company/verify). Token lifetime in hours.
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
    verification-token-ttl-hours: ${VERIFICATION_TOKEN_TTL_HOURS:24}
    # User lifecycle tokens (t_auth_tokens, tenant schema) — raw token lives only in
    # the mailed link; the DB keeps its SHA-256 digest (RISK-30 conventions).
    email-verify-ttl-hours: ${EMAIL_VERIFY_TTL_HOURS:24}
    reset-token-ttl-minutes: ${RESET_TOKEN_TTL_MINUTES:30}
    # RISK-30 stale-token retention (days): signup verification tokens consumed or
    # expired longer than this ago are purged daily at 03:00 UTC (TokenPurgeJob).
    verification-token-retention-days: ${VERIFICATION_TOKEN_RETENTION_DAYS:7}
    # Faz 5 concurrent-session limit per user. On login, if the user already holds
    # this many active sessions the oldest are evicted (login always succeeds). 0 =
    # unlimited (default). Caps the blast radius of a compromised account.
    max-sessions: ${MAX_SESSIONS:0}
    # Faz 3 token-bucket rate limit on the public auth endpoints (/auth/login,
    # /auth/company/verify, /auth/verify-email, /auth/forgot-password,
    # /auth/reset-password, /auth/refresh), keyed by scope + tenant + client IP.
    # Complements the per-account brute-force lockout (RISK-22) against credential
    # stuffing from one IP. Disabled in the test profile.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      capacity: ${RATE_LIMIT_CAPACITY:20}
      refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:20}
      refill-period-seconds: ${RATE_LIMIT_REFILL_PERIOD_SECONDS:60}
  audit:
    # High-risk request body capture (K-27). Only mutating methods (POST/PUT/PATCH/DELETE)
    # on these paths will have their request body captured and masked.
    high-risk-paths:
      - "/api/v1/users/**"
      - "/api/v1/roles/**"
      - "/api/v1/groups/**"
      - "/api/v1/permissions/**"
      - "/api/v1/platform/**"
      - "/api/v1/modules/**"
      - "/api/v1/apps/**"
    # Case-insensitive key patterns that trigger masking to [REDACTED].
    mask-patterns:
      - "password"
      - "token"
      - "secret"
      - "credential"
      - "authorization"
      - "apiKey"
      - "accessKey"
      - "clientSecret"
