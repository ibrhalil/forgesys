spring:
  datasource:
    # stringtype=unspecified is REQUIRED: t_audit_logs jsonb columns are mapped as
    # String; without it Hibernate binds varchar and PG rejects the cast. The env
    # value (see .env.example) must include ?stringtype=unspecified.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration/public
  # Externalized config overlay is wired up via SPRING_CONFIG_ADDITIONAL_LOCATION
  # env var (see docker-compose-prod.yml + .env.example) — not via spring.config.import
  # here, to avoid duplicate resolution.
  # SMTP for outgoing mail (SmtpMailSender, prod-only). Provider-agnostic: Brevo,
  # SendGrid, SES SMTP or a plain relay — all speak these properties. SmtpMailSender
  # fails startup fast when MAIL_HOST is unset (no silent mail loss in prod).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

# K-41: OpenAPI docs are a dev-only tool. Both the spec endpoint and the Swagger UI
# are disabled in prod — no API surface disclosure in deployed environments.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# RISK-24: the access-token cookie MUST be Secure in prod so it never travels over
# cleartext HTTP (redirect / mixed-content downgrade, internal network paths).
# SameSite=Lax alone does not prevent that. Dev/test keep the default (false).
# K-34: the refresh-token cookie is Secure too (same threat model — long-lived
# credential must never leak over HTTP).
jwt:
  cookie-secure: true
  refresh-cookie-secure: true

# K-50: platform cookies are Secure in prod (same threat model as the tenant cookies).
forgesys:
  platform:
    auth:
      cookie-secure: true

management:
  # K-43: management moves to its own port in prod. The main port (8080, the only
  # published one) then serves ONLY application traffic — the unauthenticated
  # /actuator/prometheus scrape endpoint is unreachable from outside the internal
  # Docker network (compose exposes 8081, never publishes it). A separate port
  # also means the main SecurityFilterChain does not apply to actuator requests
  # (child context), so the /actuator/prometheus permitAll in SecurityConfig is a
  # no-op here and exists for the dev/test same-port layout only.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        # Narrower than dev: the per-metric /actuator/metrics endpoint is a
        # debugging tool — the Prometheus scrape (/actuator/prometheus) carries
        # the same series and is what monitoring consumes.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  level:
    com.ibrhalil.forgesys: INFO
    org.hibernate.SQL: WARN
  # File appender — destination provided via env (default /app/logs in container).
  # Spring Boot writes spring.log under this directory with built-in rotation
  # (10MB per file, 7-day archive window).
  file:
    path: ${LOGGING_FILE_PATH:/app/logs}
  # Structured logging (Spring Boot 3.4+/4.1 built-in) — ECS JSON for log aggregation
  # (ELK / Loki / Datadog). Console stays JSON too so docker logs is parseable.
  structured:
    format:
      file: ecs
      console: ecs
