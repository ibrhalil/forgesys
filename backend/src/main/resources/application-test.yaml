spring:
  datasource:
    url: jdbc:h2:mem:forgesys;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: false

management:
  health:
    redis:
      # Tests must run Docker-free (AGENTS): refresh/blacklist stores are InMemory in
      # this profile, so a real Redis probe is wrong — it would fail health (503) on
      # machines without a running compose Redis (RequestLogFilterChainTest regression).
      enabled: false

forgesys:
  provisioning:
    # K-47: sample data seeding stays off in tests — fixtures are built manually and
    # provisioning tests mock the seed service.
    sample-data:
      enabled: false
  security:
    # Non-secret placeholder pepper for the test profile only. Lets the
    # PepperingPasswordEncoder bean load without a PASSWORD_PEPPER env var.
    password-pepper: test-pepper-not-a-real-secret
    # Faz 3: rate limiting disabled in the test profile so the broad auth controller
    # tests (which hit /auth/login many times from one IP) aren't throttled. The
    # limiter is verified by dedicated unit tests instead.
    rate-limit:
      enabled: false

