spring:
  datasource:
    # stringtype=unspecified lets PG infer jsonb columns mapped as String
    # (t_audit_logs.old_value/new_value/request_body); Hibernate binds them as
    # varchar otherwise and PG rejects the implicit cast.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forgesys?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:forgeadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:forgepassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration/public
  data:
    redis:
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        # K-43: same-port metrics in dev (no separate management port here —
        # IDE-friendly; SecurityConfig permits /actuator/prometheus unauthenticated).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      redis:
        enabled: false
  info:
    env:
      enabled: true

logging:
  level:
    com.ibrhalil.forgesys: DEBUG
    org.hibernate.SQL: DEBUG
  # Human-readable logs written to ./infra/logs/spring.log (project-relative —
  # resolves from the repo root: the IDE run config uses $ProjectFileDir$ and
  # spring-boot-maven-plugin pins workingDirectory to the multi-module root).
  # Set LOGGING_FILE_PATH env to override (e.g. when running outside the repo).
  file:
    path: ${LOGGING_FILE_PATH:infra/logs}

forgesys:
  security:
    cors:
      allowed-origins: ${FORGESYS_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    # Dev-only placeholder pepper (NOT a real secret). Override with PASSWORD_PEPPER
    # when testing against real data. Prod must never use this default.
    password-pepper: ${PASSWORD_PEPPER:dev-pepper-not-for-production}
  bootstrap:
    # K-50: initial platform superadmin (t_platform_users, public schema). Placeholder
    # password — never deploy to prod with it.
    platform-admin:
      enabled: ${FORGESYS_BOOTSTRAP_PLATFORM_ADMIN_ENABLED:true}
      email: ${FORGESYS_BOOTSTRAP_PLATFORM_ADMIN_EMAIL:platform-admin@forgesys.dev}
      password: ${FORGESYS_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:change-me-platform-admin}
      display-name: ${FORGESYS_BOOTSTRAP_PLATFORM_ADMIN_DISPLAY_NAME:Platform Admin}
