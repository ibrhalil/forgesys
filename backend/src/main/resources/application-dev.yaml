spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/systemforge}
    username: ${SPRING_DATASOURCE_USERNAME:forgeadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:forgepassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration/public
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

logging:
  level:
    com.ibrhalil.systemforge: DEBUG
    org.hibernate.SQL: DEBUG
