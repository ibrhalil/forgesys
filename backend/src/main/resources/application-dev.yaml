spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/systemforge}
    username: ${SPRING_DATASOURCE_USERNAME:forgeadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:forgepassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration/public
    baseline-on-migrate: true
  data:
    redis:
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      redis:
        enabled: false
  info:
    env:
      enabled: true

logging:
  level:
    com.ibrhalil.systemforge: DEBUG
    org.hibernate.SQL: DEBUG
  # Human-readable logs written to ./infra/logs/spring.log (project-relative).
  # Set LOGGING_FILE_PATH env to override (e.g. when running outside the repo).
  file:
    path: ${LOGGING_FILE_PATH:infra/logs}

systemforge:
  security:
    cors:
      allowed-origins: ${SYSTEMFORGE_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    # Dev-only placeholder pepper (NOT a real secret). Override with PASSWORD_PEPPER
    # when testing against real data. Prod must never use this default.
    password-pepper: ${PASSWORD_PEPPER:dev-pepper-not-for-production}
  bootstrap:
    system-admin:
      enabled: ${SYSTEMFORGE_BOOTSTRAP_SYSTEM_ADMIN_ENABLED:true}
      company-name: ${SYSTEMFORGE_BOOTSTRAP_SYSTEM_ADMIN_COMPANY_NAME:SystemForge System}
      subdomain: ${SYSTEMFORGE_BOOTSTRAP_SYSTEM_ADMIN_SUBDOMAIN:system}
      email-domain: ${SYSTEMFORGE_BOOTSTRAP_SYSTEM_ADMIN_EMAIL_DOMAIN:systemforge.local}
      email: ${SYSTEMFORGE_BOOTSTRAP_SYSTEM_ADMIN_EMAIL:admin@systemforge.local}
      password: ${SYSTEMFORGE_BOOTSTRAP_SYSTEM_ADMIN_PASSWORD:change-me-system-admin}
      first-name: ${SYSTEMFORGE_BOOTSTRAP_SYSTEM_ADMIN_FIRST_NAME:System}
      last-name: ${SYSTEMFORGE_BOOTSTRAP_SYSTEM_ADMIN_LAST_NAME:Administrator}
