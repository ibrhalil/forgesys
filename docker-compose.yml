# ============================================================
# Dev infra: PostgreSQL + Redis only (NO app).
# Developer runs the Spring Boot app from IntelliJ IDEA (dev profile)
# against these containers, and the frontend via "npm run dev".
#
#   docker compose up -d
#
# Sensible defaults are baked in via ${VAR:-default}, so a fresh
# checkout works without a .env file.
#
# Volumes:
#   - PostgreSQL: bind-mount under ./infra/data/postgres (host-visible).
#   - Redis: named volume (Docker-managed). The previous bind-mount to
#     ./infra/data/redis caused recurring permission errors because the
#     container wrote appendonlydir as UID 999, which host scanners
#     (IDE watchers, git) couldn't traverse. See infra/README.md.
# ============================================================
services:
  # One-shot: ensure the bind-mount dir exists with the right ownership before
  # postgres starts. Makes `rm -rf infra/data` fully recoverable — even if Docker
  # recreated the dir as root, or on Linux-native Docker without user-namespace
  # mapping. Replaces the manual `sudo chown -R 70:70` step.
  data-init:
    image: alpine:3.22
    container_name: forgesys-data-init
    restart: "no"
    volumes:
      - ./infra/data/postgres:/pgdata
    command: chown -R 70:70 /pgdata
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  db:
    image: postgres:18-alpine
    container_name: forgesys-db
    init: true
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgesys}
      POSTGRES_USER: ${POSTGRES_USER:-forgeadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgepassword}
      # Warn in container logs if no FSYNC/optimization is set (dev convenience)
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # Use a subdirectory of the bind-mount as PGDATA. Avoids "directory exists
      # but is not empty" when the mount point contains hidden files (.gitkeep,
      # .DS_Store). Official postgres image recommendation.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Persisted data (host-visible)
      - ./infra/data/postgres:/var/lib/postgresql/data
      # First-run init scripts (extensions etc.) — see infra/init-sql/README.md
      - ./infra/init-sql:/docker-entrypoint-initdb.d:ro
    # Real query, not just pg_isready: pg_isready never reaches authentication,
    # so a broken data dir (e.g. infra/data deleted while the container ran)
    # still reports healthy. SELECT 1 catches that as UNHEALTHY.
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -h /var/run/postgresql -tAc 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      # FOWNER: entrypoint chmod's /var/run/postgresql (socket dir) which is
      # owned by postgres user, not the root inside the container.
      - FOWNER
    networks:
      - forgesys-net
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.2-alpine
    container_name: forgesys-redis
    init: true
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # Named volume instead of bind-mount: avoids UID 999 permission issues
      # on the host (Windows/macOS/Linux). Data is still persisted across
      # container restarts; inspect via `docker volume inspect` if needed.
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      # DAC_OVERRIDE: the entrypoint (root, caps dropped) runs `find /data` to
      # chown everything to redis; without it root cannot traverse the 700
      # appendonlydir owned by UID 999 on restart-with-existing-data → crash loop.
      - DAC_OVERRIDE
    networks:
      - forgesys-net
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  forgesys-net:
    driver: bridge

volumes:
  redis-data:
