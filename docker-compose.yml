version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: systemforge-db
    environment:
      POSTGRES_DB: systemforge
      POSTGRES_USER: forgeadmin
      POSTGRES_PASSWORD: forgepassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeadmin -d systemforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: systemforge-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/systemforge
      - SPRING_DATASOURCE_USERNAME=forgeadmin
      - SPRING_DATASOURCE_PASSWORD=forgepassword
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    restart: always

volumes:
  postgres_data:
